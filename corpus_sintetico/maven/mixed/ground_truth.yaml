    arrastra jboss-logging, tres specs Jakarta/JBoss (annotations, jaxrs, jaxb), resteasy-core-spi, reactive-streams,
    jakarta.activation-api, jakarta.validation-api, asyncutil y smallrye-config (con su propio subarbol:
    smallrye-common-*, microprofile-config-api, org.ow2.asm:asm, smallrye-config-common). Verificados
    en OSV (2026-09-02) sin CVEs conocidos: jackson-core, org.ow2.asm:asm, smallrye-config/smallrye-config-core,
    asyncutil, jboss-logging. El resto son jars de API/spec (interfaces sin logica ejecutable: los *-api_*_spec,
    reactive-streams, jakarta.*-api, microprofile-config-api, smallrye-common-*) con riesgo de CVE practicamente
    nulo por naturaleza; no se auditaron uno a uno. Si el primer escaneo de prueba reporta algo en ellos,
    documentarlo aqui antes de usarlo para el analisis comparativo.

    '
